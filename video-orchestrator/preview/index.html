<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة فيديو الاختبار 🎬</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d1a; color: #fff; font-family: Tahoma, Arial, sans-serif; padding: 24px 16px 60px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #ffd23c; font-size: 14px; margin-bottom: 18px; }
  .player { max-width: 340px; margin: 0 auto; border-radius: 18px; overflow: hidden;
            box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.6); background: #000; }
  video { width: 100%; aspect-ratio: 9/16; display: block; background: #000; }
  .meta { display: flex; gap: 8px; justify-content: center; margin: 16px 0 26px; flex-wrap: wrap; }
  .meta span { background: #1c1c33; border: 1px solid #33335c; border-radius: 20px;
               padding: 6px 14px; font-size: 12px; color: #cfcfff; }
  h2 { font-size: 16px; margin-bottom: 12px; color: #ffd23c; }
  .scenes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .scenes img { width: 150px; border-radius: 12px; border: 1px solid #33335c; }
  .scenes figure { font-size: 12px; color: #aaa; }
  .scenes figcaption { margin-top: 6px; }
</style>
</head>
<body>
  <h1>🎬 فيديو الاختبار — محرك الإنتاج الذكي</h1>
  <div class="sub">اضغط تشغيل للمعاينة الفورية</div>

  <div class="player">
    <video controls autoplay muted loop playsinline preload="auto"
           poster="../previews/scene_1.png">
      <source src="../test_video.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>
  </div>

  <div class="meta">
    <span>⏱️ 11.4 ثانية</span>
    <span>📐 عمودي 720×1280 (9:16)</span>
    <span>🎞️ 3 مشاهد</span>
    <span>🔤 ترجمة ديناميكية</span>
  </div>

  <h2>📸 لقطات المشاهد</h2>
  <div class="scenes">
    <figure><img src="../previews/scene_1.png" alt="مشهد 1"><figcaption>مشهد 1</figcaption></figure>
    <figure><img src="../previews/scene_2.png" alt="مشهد 2"><figcaption>مشهد 2</figcaption></figure>
    <figure><img src="../previews/scene_3.png" alt="مشهد 3"><figcaption>مشهد 3</figcaption></figure>
  </div>
</body>
</html>
